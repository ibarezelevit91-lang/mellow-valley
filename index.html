<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Vitor</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #180000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Courier New", monospace;
            position: relative;
        }

        .imagen {
            width: 70%;
            max-width: 800px;

            filter:
                grayscale(100%)
                contrast(180%)
                sepia(100%)
                hue-rotate(300deg)
                brightness(45%);

            opacity: 0.9;

            box-shadow:
                0 0 40px #000,
                0 0 100px #300000;
        }

     

        .secreto {
            position: absolute;
            color: #080000;
            font-size: 18px;
            z-index: 10;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(0,0,0,0.08),
                    rgba(0,0,0,0.08) 1px,
                    transparent 1px,
                    transparent 3px
                );

            pointer-events: none;
        }

        .vitor {
            position: absolute;
            top: 20px;
            left: 25px;
            color: #210000;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!--
    01000100 01100101 01110011 01100001 01110000 01100001 01110010 01100101 01100011 01101001 01101111
    01110000 01101111 01110010
    00110010
    01110011 01100101 01101101 01100001 01101110 01100001 01110011

    NO DEBERIAS ESTAR INSPECCIONANDO ESTO.
    -->

    <div class="vitor">
        VITOR
    </div>

    <img src="vitor.jpg" class="imagen" alt="">

    <div class="secreto">
        El murio
    </div>


    <audio id="vitorAudio" loop preload="auto">
        <source src="Vitor.mp3" type="audio/mpeg">
    </audio>

    <script>

        const audio = document.getElementById("vitorAudio");

        audio.volume = 0.35;

    
        window.addEventListener("load", function () {
            audio.play().catch(function () {
                console.log("El navegador bloqueó el autoplay.");
            });
        });

        document.addEventListener("click", function () {
            audio.play();
        }, { once: true });

    </script>

</body>
</html>
